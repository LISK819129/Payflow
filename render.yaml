# Render Blueprint for PayFlow (judging deployment). See docs/DEPLOYMENT.md.
# No secrets live here. Values marked `sync: false` are entered once in the
# Render Dashboard when the Blueprint is created (Render ignores them on later
# Blueprint syncs). PayPal stays in Sandbox; PayFlow refuses to boot against
# live PayPal. Check this file with `pnpm deploy:check` before creating anything.
#
# Exactly ONE web instance: rate limits are per process (documented). Do not
# enable autoscaling or raise numInstances without moving them to Postgres.
#
# Plans (Render's current plan IDs; legacy names in brackets):
#   payflow-web     0.5c-512mb  [Starter]       web service
#   payflow-worker  0.5c-512mb  [Starter]       background worker (no free plan exists)
#   payflow-db      0.1c-256mb  [Basic-256mb]   PostgreSQL 18, 1 GB disk

databases:
  - name: payflow-db
    databaseName: payflow
    user: payflow
    plan: 0.1c-256mb
    diskSizeGB: 1
    postgresMajorVersion: "18"

services:
  - type: web
    name: payflow-web
    runtime: node
    plan: 0.5c-512mb
    numInstances: 1
    region: oregon
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    # Idempotent: applies migrations and creates the judge owner if missing.
    preDeployCommand: pnpm db:migrate && pnpm db:seed
    startCommand: pnpm start
    healthCheckPath: /api/health/ready
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: payflow-db
          property: connectionString
      # APP_URL defaults to Render's RENDER_EXTERNAL_URL (https://<service>.onrender.com).
      - key: SESSION_SECRET # 256-bit random, generated by Render
        generateValue: true
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID # the existing PixelForge US Sandbox app
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID # the existing Sandbox webhook (a public identifier); moved, never recreated
        value: 9MJ408823R309725D
      - key: PAYPAL_ALLOW_SIMULATOR_EVENTS
        value: "false"
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_BUDGET_USD # lifetime hard cap across all model calls on this database
        value: "5"
      - key: AI_DAILY_CAP_USD # rolling 24 h cap for the public judging deployment
        value: "1"
      - key: AI_COMPILES_PER_USER_PER_HOUR
        value: "12"
      - key: AI_COMPILES_PER_WORKSPACE_PER_DAY
        value: "60"
      - key: TEST_RUNS_PER_USER_PER_HOUR
        value: "60"
      - key: PAYFLOW_DEMO_MODE
        value: "true"
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: SEED_OWNER_EMAIL # the judge login (an identifier, not a secret)
        value: judge@payflow.demo
      - key: SEED_OWNER_PASSWORD # a NEW strong password, entered in the Dashboard; share with judges privately
        sync: false
      # The two PayPal Sandbox *personal* accounts that receive demo payouts (identifiers, not secrets).
      - key: DEMO_SUPPLIER_ACME_EMAIL # Acme Cloud
        value: sb-yluat53193698@personal.example.com
      - key: DEMO_SUPPLIER_AWS_EMAIL # AWS Demo
        value: sb-mnylb53193692@personal.example.com

  - type: worker
    name: payflow-worker
    runtime: node
    plan: 0.5c-512mb
    numInstances: 1
    region: oregon
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm worker
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: PAYFLOW_WORKER_WATCH # a deployed worker never reloads code under itself
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: payflow-db
          property: connectionString
      - key: SESSION_SECRET # required by config validation; the worker creates no sessions
        generateValue: true
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID # same values as the web service
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        value: 9MJ408823R309725D
      - key: PAYPAL_ALLOW_SIMULATOR_EVENTS
        value: "false"
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_BUDGET_USD
        value: "5"
      - key: AI_DAILY_CAP_USD
        value: "1"
      - key: PAYFLOW_DEMO_MODE
        value: "true"
